<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<title>Centinela — Control</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D12;
  --surface:#131822;
  --surface-2:#1B2230;
  --border:#232B3A;
  --text:#EDF1F5;
  --text-dim:#7C8797;
  --accent:#00E5B0;
  --accent-dim:#0A3D34;
  --danger:#FF4757;
  --danger-dim:#3D1219;
  --warn:#FFB020;
  --warn-dim:#3D2E0A;
  --radius:16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
.app{
  max-width:480px;
  margin:0 auto;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(1200px 600px at 50% -10%, #101623 0%, var(--bg) 55%);
}

/* ---------- Status bar ---------- */
.statusbar{
  padding:calc(14px + var(--safe-top)) 20px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{
  width:26px; height:26px; border-radius:7px;
  background:linear-gradient(145deg, var(--accent), #00A88A);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 14px rgba(0,229,176,.35);
}
.brand-mark svg{width:14px; height:14px;}
.brand-name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; letter-spacing:.5px;}
.status-pill{
  display:flex; align-items:center; gap:6px;
  padding:6px 12px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-dim);
}
.status-pill .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}

/* ---------- Screen content ---------- */
.screens{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
.screen{padding:20px 20px calc(24px + var(--safe-bottom)); animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:1.5px;
  color:var(--text-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
h1.screen-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; margin-bottom:20px;}

/* ---------- Signature: Shield radar toggle ---------- */
.shield-wrap{
  position:relative;
  width:220px; height:220px;
  margin:6px auto 22px;
  display:flex; align-items:center; justify-content:center;
}
.ring{
  position:absolute; border-radius:50%;
  border:1px solid var(--border);
}
.ring.r1{width:100%; height:100%;}
.ring.r2{width:78%; height:78%;}
.ring.r3{width:56%; height:56%;}
.app[data-armed="true"] .ring{border-color:rgba(0,229,176,.25);}
.app[data-armed="true"] .ring.sweep{
  border-top-color:var(--accent);
  animation:spin 3.2s linear infinite;
}
.app[data-armed="false"] .ring.sweep{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.shield-btn{
  position:relative; z-index:2;
  width:126px; height:126px;
  border-radius:50%;
  border:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px;
  cursor:pointer;
  background:radial-gradient(circle at 35% 30%, var(--surface-2), var(--surface) 70%);
  box-shadow:inset 0 0 0 1px var(--border), 0 12px 30px rgba(0,0,0,.4);
  transition:box-shadow .3s ease, background .3s ease;
}
.app[data-armed="true"] .shield-btn{
  box-shadow:inset 0 0 0 1px rgba(0,229,176,.5), 0 0 40px rgba(0,229,176,.28), 0 12px 30px rgba(0,0,0,.4);
}
.shield-btn svg{width:36px; height:36px; stroke:var(--text-dim); transition:stroke .3s ease;}
.app[data-armed="true"] .shield-btn svg{stroke:var(--accent);}
.shield-label{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:1px; color:var(--text-dim);}
.app[data-armed="true"] .shield-label{color:var(--accent);}
.shield-sub{
  text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:26px;
}
.shield-sub b{color:var(--text); font-weight:600;}

/* ---------- Stat grid ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
}
.stat-label{font-size:11px; color:var(--text-dim); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
.stat-label svg{width:13px; height:13px; stroke:var(--text-dim);}
.stat-value{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:600;}
.stat-value.ok{color:var(--accent);}
.stat-value.warn{color:var(--warn);}
.stat-unit{font-size:12px; color:var(--text-dim); font-weight:400; margin-left:2px;}

/* ---------- Section header ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.section-head h2{font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:600; letter-spacing:.3px;}
.section-head a{font-size:12px; color:var(--accent); text-decoration:none;}

/* ---------- Event feed ---------- */
.event{
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}
.event:last-child{border-bottom:none;}
.event-icon{
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface-2);
}
.event-icon svg{width:16px; height:16px;}
.event-icon.warn{background:var(--warn-dim);} .event-icon.warn svg{stroke:var(--warn);}
.event-icon.ok{background:var(--accent-dim);} .event-icon.ok svg{stroke:var(--accent);}
.event-icon.danger{background:var(--danger-dim);} .event-icon.danger svg{stroke:var(--danger);}
.event-body{flex:1;}
.event-title{font-size:13.5px; font-weight:500;}
.event-time{font-size:11.5px; color:var(--text-dim); margin-top:2px; font-family:'JetBrains Mono',monospace;}

/* ---------- Map screen ---------- */
.map-card{
  height:280px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:
    linear-gradient(var(--surface), var(--surface)) padding-box,
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(255,255,255,.03) 28px),
    repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(255,255,255,.03) 28px);
  position:relative;
  overflow:hidden;
  margin-bottom:16px;
}
.map-pin{
  position:absolute; top:48%; left:52%;
  width:16px; height:16px; border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 4px rgba(0,229,176,.18), 0 0 16px rgba(0,229,176,.5);
}
.map-pin::after{
  content:''; position:absolute; inset:-14px; border-radius:50%;
  border:1px solid rgba(0,229,176,.35);
  animation:pulse 2.2s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.4); opacity:.9;} 100%{transform:scale(1.8); opacity:0;}}
.map-geo{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:150px; height:150px; border-radius:50%;
  border:1.5px dashed rgba(124,135,151,.4);
}
.map-badge{
  position:absolute; bottom:12px; left:12px; right:12px;
  background:rgba(10,13,18,.75);
  backdrop-filter:blur(6px);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 12px;
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  color:var(--text-dim);
}
.map-badge b{color:var(--text); font-weight:600;}

.list-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:10px;
}
.list-row-label{font-size:13.5px; font-weight:500;}
.list-row-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}

/* ---------- Toggle switch ---------- */
.switch{width:44px; height:26px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--text-dim); transition:all .2s ease;}
.switch.on{background:var(--accent-dim); border-color:rgba(0,229,176,.4);}
.switch.on::after{transform:translateX(18px); background:var(--accent);}

/* ---------- Control grid ---------- */
.ctrl-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
.ctrl-btn{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 14px;
  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  cursor:pointer;
  color:var(--text);
  font-family:'Inter',sans-serif;
  transition:transform .12s ease, border-color .2s ease;
}
.ctrl-btn:active{transform:scale(.96);}
.ctrl-btn svg{width:20px; height:20px; stroke:var(--accent);}
.ctrl-btn span{font-size:13px; font-weight:500;}
.ctrl-btn.danger svg{stroke:var(--danger);}
.ctrl-btn.danger:active{border-color:var(--danger);}
.ctrl-btn.full{grid-column:1 / -1; flex-direction:row; align-items:center; justify-content:space-between;}

/* ---------- Camera screen ---------- */
.cam-feed{
  height:220px; border-radius:var(--radius); border:1px solid var(--border);
  background:linear-gradient(160deg, #10141c, #080a0e);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
  margin-bottom:16px; position:relative; overflow:hidden;
}
.cam-feed .rec{
  position:absolute; top:12px; left:12px;
  display:flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--danger);
}
.cam-feed .rec .dot{width:7px; height:7px; border-radius:50%; background:var(--danger); animation:blink 1.4s infinite;}
@keyframes blink{50%{opacity:.2;}}
.cam-feed p{color:var(--text-dim); font-size:12.5px;}
.cam-feed svg{width:34px; height:34px; stroke:var(--text-dim);}

.gallery{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.gallery-item{
  aspect-ratio:1; border-radius:10px; background:var(--surface-2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
}
.gallery-item svg{width:18px; height:18px; stroke:var(--text-dim);}

/* ---------- Settings ---------- */
.settings-group{margin-bottom:22px;}
.settings-group h3{font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px;}

/* ---------- Bottom nav ---------- */
.tabbar{
  flex-shrink:0;
  display:flex;
  border-top:1px solid var(--border);
  background:rgba(19,24,34,.85);
  backdrop-filter:blur(10px);
  padding:10px 6px calc(8px + var(--safe-bottom));
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; color:var(--text-dim); cursor:pointer;
  padding:6px 2px;
  text-decoration:none;
}
.tab svg{width:21px; height:21px; stroke:var(--text-dim); transition:stroke .2s ease;}
.tab span{font-size:10.5px; font-weight:500;}
.tab.active svg{stroke:var(--accent);}
.tab.active span{color:var(--accent);}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--surface-2); border:1px solid var(--border);
  padding:11px 18px; border-radius:999px;
  font-size:12.5px; font-weight:500;
  opacity:0; pointer-events:none; transition:all .25s ease;
  max-width:90%; text-align:center;
  z-index:50;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{display:none;}

a, button{outline-offset:3px;}
a:focus-visible, button:focus-visible{outline:2px solid var(--accent);}

/* ---------- Vínculo del teléfono (llave digital) ---------- */
.key-link{
  display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:20px;
}
.key-link-icon{
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  background:var(--surface-2); display:flex; align-items:center; justify-content:center;
}
.key-link-icon svg{width:18px; height:18px; stroke:var(--accent);}
.beam{display:flex; gap:4px; align-items:center;}
.beam-dot{width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.25; animation:beamPulse 1.4s infinite;}
.beam-dot:nth-child(2){animation-delay:.18s;}
.beam-dot:nth-child(3){animation-delay:.36s;}
@keyframes beamPulse{0%,100%{opacity:.25; transform:scale(.75);} 50%{opacity:1; transform:scale(1.2);}}
.key-link-status{flex:1;}
.key-link-title{font-size:13.5px; font-weight:600;}
.key-link-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px; font-family:'JetBrains Mono',monospace;}

/* ---------- Seguros: control segmentado ---------- */
.segmented{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px; gap:4px; margin-bottom:18px;}
.segmented-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  padding:11px; border:none; background:transparent; border-radius:10px;
  color:var(--text-dim); font-family:'Inter',sans-serif; font-size:13px; font-weight:500;
  cursor:pointer; transition:background .25s ease, color .25s ease, box-shadow .25s ease;
}
.segmented-btn svg{width:15px; height:15px; stroke:currentColor; transition:stroke .25s ease;}
.segmented-btn.active{background:var(--accent-dim); color:var(--accent); box-shadow:inset 0 0 0 1px rgba(0,229,176,.3);}
.segmented-btn:active{transform:scale(.97);}

/* ---------- Vidrios: nivel visual ---------- */
.window-row{display:flex; gap:10px; margin-bottom:18px;}
.window-card{flex:1; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px;}
.window-visual{width:28px; height:46px; border-radius:6px; border:1.5px solid var(--border); background:var(--surface-2); position:relative; overflow:hidden; flex-shrink:0;}
.window-glass{position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg, rgba(0,229,176,.65), rgba(0,229,176,.18)); transition:height .5s cubic-bezier(.4,0,.2,1);}
.window-info{flex:1; min-width:0;}
.window-label{font-size:12px; font-weight:500;}
.window-pct{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:2px;}
.window-btns{display:flex; flex-direction:column; gap:5px;}
.window-btns button{width:28px; height:24px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s ease, background .2s ease;}
.window-btns button svg{width:12px; height:12px; stroke:var(--text);}
.window-btns button:active{transform:scale(.85); background:var(--accent-dim);}

/* ---------- Luces: bombillo con efecto de encendido ---------- */
/* ---------- Luces: grilla de circuitos individuales ---------- */
.light-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:10px;}
.light-item{
  display:flex; flex-direction:column; align-items:center; gap:7px;
  background:var(--surface); border:1px solid var(--border); border-radius:13px;
  padding:12px 6px; cursor:pointer; color:var(--text-dim);
  transition:all .25s ease; position:relative;
}
.light-item-icon{width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; transition:all .3s ease;}
.light-item-icon svg{width:15px; height:15px; stroke:var(--text-dim); transition:stroke .3s ease;}
.light-item-label{font-size:10.5px; font-weight:500; text-align:center; line-height:1.2;}
.light-item.on{border-color:rgba(255,176,32,.4);}
.light-item.on .light-item-icon{background:var(--warn-dim); box-shadow:0 0 14px rgba(255,176,32,.5);}
.light-item.on .light-item-icon svg{stroke:var(--warn);}
.light-item.on .light-item-label{color:var(--text);}
.light-item.fault{border-color:rgba(255,71,87,.5);}
.light-item.fault .light-item-icon{background:var(--danger-dim);}
.light-item.fault .light-item-icon svg{stroke:var(--danger);}
.light-item.fault::after{
  content:'!'; position:absolute; top:6px; right:8px;
  width:15px; height:15px; border-radius:50%; background:var(--danger); color:#fff;
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  animation:blink 1.4s infinite;
}

.fault-banner{
  display:flex; align-items:center; gap:10px;
  background:var(--danger-dim); border:1px solid rgba(255,71,87,.4); border-radius:12px;
  padding:12px 14px; margin-bottom:12px;
  font-size:12.5px; font-weight:500; color:var(--text);
}
.fault-banner svg{width:18px; height:18px; stroke:var(--danger); flex-shrink:0;}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="statusbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0A0D12" stroke-width="2.5"><path d="M12 2l8 3v6c0 5-3.4 8.4-8 11-4.6-2.6-8-6-8-11V5l8-3z"/></svg>
      </div>
      <div class="brand-name">CENTINELA</div>
    </div>
    <div class="status-pill"><span class="dot"></span><span>ARMADO</span></div>
  </div>

  <div class="screens">
    <section class="screen" id="screen-control">
      <div class="eyebrow">Control remoto</div>
      <h1 class="screen-title">Acciones rápidas</h1>

      <div class="key-link" id="keyLinkCard" onclick="connectBLE()">
        <div class="key-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        </div>
        <div class="beam" style="opacity:.35"><span class="beam-dot"></span><span class="beam-dot"></span><span class="beam-dot"></span></div>
        <div class="key-link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.4 8.4-8 11-4.6-2.6-8-6-8-11V5l8-3z"/></svg>
        </div>
        <div class="key-link-status">
          <div class="key-link-title">Toca para vincular por Bluetooth</div>
          <div class="key-link-sub">Sin conexión</div>
        </div>
      </div>

      <div class="section-head"><h2>Seguros</h2></div>
      <div class="segmented">
        <button class="segmented-btn active" id="lockBtnClosed" onclick="setLock(true)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          Cerrado
        </button>
        <button class="segmented-btn" id="lockBtnOpen" onclick="setLock(false)">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 017.6-1.8"/></svg>
          Abierto
        </button>
      </div>

      <div class="section-head"><h2>Vidrios</h2></div>
      <div class="window-row">
        <div class="window-card">
          <div class="window-visual"><div class="window-glass" id="glassL" style="height:35%"></div></div>
          <div class="window-info">
            <div class="window-label">Delanteros</div>
            <div class="window-pct" id="pctL">35%</div>
          </div>
          <div class="window-btns">
            <button onclick="moveWindow('L',15)" aria-label="Subir vidrio delantero"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            <button onclick="moveWindow('L',-15)" aria-label="Bajar vidrio delantero"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
          </div>
        </div>
        <div class="window-card">
          <div class="window-visual"><div class="window-glass" id="glassR" style="height:35%"></div></div>
          <div class="window-info">
            <div class="window-label">Traseros</div>
            <div class="window-pct" id="pctR">35%</div>

          <div class="window-btns">
            <button onclick="moveWindow('R',15)" aria-label="Subir vidrio trasero"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
            <button onclick="moveWindow('R',-15)" aria-label="Bajar vidrio trasero"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>

        <button class="light-item" data-id="TURN_L" onclick="toggleLight('TURN_L')">

        <button class="light-item" data-id="BRAKE" onclick="toggleLight('BRAKE')">

        <button class="light-item" data-id="REVERSE" onclick="toggleLight('REVERSE')">

          <span class="light-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 8h18M3 12h18M3 16h12"/></svg></span>

      <div class="ctrl-grid">
        <button class="ctrl-btn" onclick="sendCmd('TRUNK'); toast('Maletero abierto')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 10l2-6h14l2 6M3 10h18M3 10v9a1 1 0 001 1h1a1 1 0 001-1v-1h12v1a1 1 0 001 1h1a1 1 0 001-1v-9"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2.3"/></svg>

        <button class="ctrl-btn" onclick="sendCmd('START_ENGINE'); toast('Arranque remoto iniciado')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          <span>Arranque remoto</span>

        <button class="ctrl-btn full danger" onclick="sendCmd('HORN'); toast('Sirena activada')">

        <button class="ctrl-btn full danger" onclick="confirmStop()">

            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>

<script>
// ---------- Toggle armar/desarmar (solo existe en inicio.html) ----------
const app = document.getElementById('app');
const shieldBtn = document.getElementById('shieldBtn');

if (shieldBtn) {
  const shieldLabel = document.getElementById('shieldLabel');
  const shieldSubState = document.getElementById('shieldSubState');
  const statusPillText = document.getElementById('statusPillText');

  shieldBtn.addEventListener('click', () => {
    const armed = app.dataset.armed === 'true';
    const next = !armed;
    app.dataset.armed = String(next);
    shieldBtn.setAttribute('aria-pressed', String(next));
    shieldLabel.textContent = next ? 'ARMADO' : 'DESARMADO';
    shieldSubState.textContent = next ? 'activo' : 'en pausa';
    statusPillText.textContent = next ? 'ARMADO' : 'DESARMADO';
    toast(next ? 'Vehículo armado' : 'Vehículo desarmado');
  });
}

// ---------- Switches genéricos (presentes en varias páginas) ----------
document.querySelectorAll('.switch').forEach(sw => {
  if (sw.id === 'lightSwitch') return; // lo controla toggleLights()
  sw.addEventListener('click', () => sw.classList.toggle('on'));
});

// ---------- Seguros: control segmentado (solo en control.html) ----------
function setLock(locked, sendToBle = true) {
  const closedBtn = document.getElementById('lockBtnClosed');
  const openBtn = document.getElementById('lockBtnOpen');
  if (!closedBtn || !openBtn) return;
  closedBtn.classList.toggle('active', locked);
  openBtn.classList.toggle('active', !locked);
  if (sendToBle) {
    sendCmd(locked ? 'LOCK' : 'UNLOCK');
    toast(locked ? 'Seguros cerrados' : 'Seguros abiertos');
  }
}

// ---------- Vidrios: nivel visual animado (solo en control.html) ----------
const windowState = { L: 35, R: 35 };
function moveWindow(side, delta, sendToBle = true) {
  const glass = document.getElementById('glass' + side);
  const pct = document.getElementById('pct' + side);
  if (!glass || !pct) return;
  windowState[side] = Math.max(0, Math.min(100, windowState[side] + delta));
  glass.style.height = windowState[side] + '%';
  pct.textContent = windowState[side] + '%';
  if (sendToBle) {
    sendCmd('WIN_' + side + '_' + (delta > 0 ? 'UP' : 'DOWN'));
    const zona = side === 'L' ? 'delantero' : 'trasero';
    toast((delta > 0 ? 'Subiendo' : 'Bajando') + ' vidrio ' + zona + '…');
  }
}

// ---------- Luces: circuitos individuales (solo en control.html) ----------
const lightIds = ['LOWBEAM','HIGHBEAM','TURN_L','TURN_R','BRAKE','REVERSE','FOG','PARK'];
const lightState = {};
lightIds.forEach(id => lightState[id] = false);

function toggleLight(id, sendToBle = true) {
  const el = document.querySelector('.light-item[data-id="' + id + '"]');
  if (!el) return;
  const on = !lightState[id];
  lightState[id] = on;
  el.classList.toggle('on', on);
  if (sendToBle) {
    sendCmd('LIGHT:' + id + ':' + (on ? 'ON' : 'OFF'));
    const label = el.querySelector('.light-item-label').textContent;
    toast((on ? 'Encendiendo' : 'Apagando') + ' luces ' + label.toLowerCase());
  }
}

function setLightRemote(id, on) {
  const el = document.querySelector('.light-item[data-id="' + id + '"]');
  if (!el) return;
  lightState[id] = on;
  el.classList.toggle('on', on);
}

function showFaults(faults) {
  const banner = document.getElementById('lightFaultBanner');
  const text = document.getElementById('lightFaultText');
  if (!banner || !text) return;
  document.querySelectorAll('.light-item').forEach(el => el.classList.remove('fault'));
  if (!faults || faults.length === 0) {
    banner.style.display = 'none';
    return;
  }
  faults.forEach(f => {
    // f llega como "Luces bajas fundida" — buscar el item cuyo label coincida al inicio
    document.querySelectorAll('.light-item').forEach(el => {
      const label = el.querySelector('.light-item-label').textContent;
      if (f.toLowerCase().startsWith(label.toLowerCase())) el.classList.add('fault');
    });
  });
  banner.style.display = 'flex';
  text.textContent = faults.length === 1 ? faults[0] : faults.length + ' focos con posible falla';
}

// ==========================================================================
// CONEXIÓN BLUETOOTH REAL (Web Bluetooth API) — habla con el ESP32
// Requiere Chrome en Android o computadora. No funciona en Safari/iPhone.
// Los UUID deben coincidir exactamente con los del firmware centinela_firmware.ino
// ==========================================================================
const BLE_SERVICE     = '12345678-1234-5678-1234-56789abcdef0';
const BLE_CMD_CHAR     = '12345678-1234-5678-1234-56789abcdef1';
const BLE_STATUS_CHAR  = '12345678-1234-5678-1234-56789abcdef2';

let bleDevice = null;
let bleCmdChar = null;
let bleConnected = false;

function updateLinkUI(connected) {
  const title = document.querySelector('.key-link-title');
  const sub = document.querySelector('.key-link-sub');
  const beam = document.querySelector('.beam');
  if (!title) return;
  title.textContent = connected ? 'Llave digital vinculada' : 'Toca para vincular por Bluetooth';
  sub.textContent = connected ? 'Bluetooth · conectado' : 'Sin conexión';
  if (beam) beam.style.opacity = connected ? '1' : '.35';
}

function onStatusUpdate(event) {
  try {
    const json = new TextDecoder().decode(event.target.value);
    const s = JSON.parse(json);
    if (typeof s.locked === 'boolean') setLock(s.locked, false);
    if (typeof s.windowL === 'number') {
      windowState.L = s.windowL;
      const g = document.getElementById('glassL'), p = document.getElementById('pctL');
      if (g) g.style.height = s.windowL + '%';
      if (p) p.textContent = s.windowL + '%';
    }
    if (typeof s.windowR === 'number') {
      windowState.R = s.windowR;
      const g = document.getElementById('glassR'), p = document.getElementById('pctR');
      if (g) g.style.height = s.windowR + '%';
      if (p) p.textContent = s.windowR + '%';
    }
    if (s.lights && typeof s.lights === 'object') {
      Object.keys(s.lights).forEach(id => setLightRemote(id, s.lights[id]));
    }
    if (Array.isArray(s.faults)) {
      showFaults(s.faults);
    }
  } catch (err) {
    console.warn('Estado BLE inválido:', err);
  }
}

function onBleDisconnected() {
  bleConnected = false;
  updateLinkUI(false);
  toast('Se perdió la conexión Bluetooth con el vehículo');
}

async function gattConnect() {
  const server = await bleDevice.gatt.connect();
  const service = await server.getPrimaryService(BLE_SERVICE);
  bleCmdChar = await service.getCharacteristic(BLE_CMD_CHAR);
  const statusChar = await service.getCharacteristic(BLE_STATUS_CHAR);
  await statusChar.startNotifications();
  statusChar.addEventListener('characteristicvaluechanged', onStatusUpdate);
  bleDevice.addEventListener('gattserverdisconnected', onBleDisconnected);
  bleConnected = true;
  updateLinkUI(true);
  toast('Vinculado con el vehículo por Bluetooth');
}

async function connectBLE() {
  if (!navigator.bluetooth) {
    toast('Este navegador no soporta Bluetooth (usa Chrome en Android)');
    return;
  }
  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [BLE_SERVICE] }]
    });
    await gattConnect();
  } catch (err) {
    toast('No se pudo vincular: ' + err.message);
  }
}

// Reconexión silenciosa a un dispositivo ya autorizado antes (sin volver a pedir permiso)
async function tryReconnectBLE() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  try {
    const devices = await navigator.bluetooth.getDevices();
    if (devices.length) {
      bleDevice = devices[0];
      await gattConnect();
    }
  } catch (err) {
    // El vehículo está fuera de rango o apagado — se queda desconectado
  }
}

async function sendCmd(cmd) {
  if (!bleConnected || !bleCmdChar) {
    toast('Sin conexión Bluetooth con el vehículo');
    return;
  }
  try {
    await bleCmdChar.writeValue(new TextEncoder().encode(cmd));
  } catch (err) {
    toast('Error enviando comando: ' + err.message);
  }
}

window.addEventListener('load', tryReconnectBLE);

// ---------- Toast ----------
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ---------- Confirmación de apagado remoto (solo en control.html) ----------
function confirmStop() {
  if (confirm('¿Apagar el motor de forma remota? Esta acción solo se ejecuta si el vehículo está detenido.')) {
    sendCmd('STOP_ENGINE');
    toast('Solicitud de apagado enviada');
  }
}

// ---------- Registro del Service Worker ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
